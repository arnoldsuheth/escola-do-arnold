ínio. Adicione um segundo parágrafo e explique por que ele só aparece depois de salvar."}]}, {"id": 1, "theory": "Uma tag delimita um elemento. Atributos configuram esse elemento: em um link, href define o destino. A maioria dos atributos com valor usa nome=\"valor\", mas atributos booleanos como required e disabled podem aparecer sem sinal de igual. Elementos vazios, como img e input, não recebem tag de fechamento.", "code": "\u003ca href=\"#colecao\">Explorar coleção\u003c/a>\n\u003csection id=\"colecao\">\u003ch2>Coleção\u003c/h2>\u003c/section>\n\u003cinput required aria-label=\"Nome\">", "explain": "a abre o link e /a o fecha. O fragmento #colecao procura o id correspondente. required significa obrigatório mesmo sem =.", "tasks": ["No body de index.html, acrescente o link e a seção.", "Mude id para produtos e teste o link antigo.", "Corrija o href e inspecione o elemento no navegador."], "expected": "O fragmento do endereço aponta para a seção com o mesmo id.", "bug": "Um destino #colecao não encontra id=\"produtos\". Os nomes precisam coincidir.", "challenge": "Crie outra seção com link próprio e identifique tag, atributo e valor.", "question": "Qual atributo pode ser escrito sem valor explícito?", "choices": ["required", "href", "src", "lang"], "title": "Anatomia do HTML: tags, elementos, atributos, head e body", "minutes": 120, "quiz": [{"question": "Qual atributo pode ser escrito sem valor explícito?", "options": ["href", "src", "lang", "required"], "answer": 3, "explanation": "Conceito: a abre o link e /a o fecha. O fragmento #colecao procura o id correspondente. required significa obrigatório mesmo sem =."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "O fragmento do endereço aponta para a seção com o mesmo id.", "Apenas que o arquivo foi salvo, sem executar o cenário."], "answer": 2, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O fragmento do endereço aponta para a seção com o mesmo id."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Ignorar os erros e marcar a prática como concluída.", "Um destino #colecao não encontra id=\"produtos\". Os nomes precisam coincidir.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações."], "answer": 1, "explanation": "Este diagnóstico ajuda a localizar a causa. Um destino #colecao não encontra id=\"produtos\". Os nomes precisam coincidir."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Crie outra seção com link próprio e identifique tag, atributo e valor.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Crie outra seção com link próprio e identifique tag, atributo e valor."}]}, {"id": 2, "theory": "Títulos organizam o raciocínio da página. Use h1 para o assunto principal e h2 para seções; o número não deve ser escolhido pelo tamanho visual. strong indica importância e em indica ênfase. Parágrafos são blocos de texto; br é uma quebra pontual, não uma ferramenta para montar layout.", "code": "\u003ch1>BLESSAINT\u003c/h1>\n\u003ch2>Nova coleção\u003c/h2>\n\u003cp>Conheça a \u003cstrong>coleção de estudo\u003c/strong>.\u003c/p>\n\u003cp>Uma peça com \u003cem>personalidade\u003c/em>.\u003c/p>", "explain": "Os títulos formam uma hierarquia. A aparência será ajustada com CSS. Um h1 principal é uma convenção útil neste projeto, não uma regra de que HTML rejeita qualquer outro h1.", "tasks": ["Organize o conteúdo da página com um h1 e dois h2.", "Crie um parágrafo para cada seção.", "Marque uma expressão importante com strong."], "expe ítulo da página e encerrar o módulo.", "Escreva a seção Sobre com hierarquia coerente e sem usar br para espaçamento."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Escreva a seção Sobre com hierarquia coerente e sem usar br para espaçamento."}]}, {"id": 3, "theory": "Links navegam; botões executam ações. Caminhos relativos dependem da localização do arquivo atual. Um endereço começando por https:// aponta para outra origem; sobre.html aponta para um arquivo na mesma pasta. Uma âncora aponta para um id da página.", "code": "\u003cnav>\u003ca href=\"index.html\">Início\u003c/a> \u003ca href=\"sobre.html\">Sobre\u003c/a>\u003c/nav>\n\u003ca href=\"#colecao\">Explorar coleção\u003c/a>", "explain": "href não é uma função JavaScript. Você pode navegar sem programar um clique. Manter links nativos preserva teclado e abertura em outra aba.", "tasks": ["Crie sobre.html copiando a estrutura básica.", "Coloque a navegação nas duas páginas.", "Abra Sobre e volte para Início usando os links."], "expected": "As duas páginas abrem sem erro e a navegação funciona por Tab e Enter.", "bug": "Se houver 404, compare nome, extensão e maiúsculas do arquivo.", "challenge": "Crie uma página contato.html com link de volta.", "question": "Quando usar a em vez de button?", "choices": ["Para navegar a outro endereço", "Para somar quantidades", "Para limpar formulário por script", "Para alternar um estado local"], "title": "Links: \u003ca>, links internos e externos, página Sobre", "minutes": 120, "quiz": [{"question": "Quando usar a em vez de button?", "options": ["Para alternar um estado local", "Para navegar a outro endereço", "Para somar quantidades", "Para limpar formulário por script"], "answer": 1, "explanation": "Conceito: href não é uma função JavaScript. Você pode navegar sem programar um clique. Manter links nativos preserva teclado e abertura em outra aba."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["As duas páginas abrem sem erro e a navegação funciona por Tab e Enter.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta."], "answer": 0, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. As duas páginas abrem sem erro e a navegação funciona por Tab e Enter."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Se houver 404, compare nome, extensão e maiúsculas do arquivo."], "answer": 3, "explanation": "Este diagnóstico ajuda a localizar a causa. Se houver 404, compare nome, extensão e maiúsculas do arquivo."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Crie uma página contato.html com link de volta.", "Copiar o exemplo sem executar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Crie uma página contato.html com link de volta."}]}, {"id": 4, "theory": "Uma imagem usa src para localizar o arquivo e alt para transmitir sua informação a quem não pode vê-la. Uma imagem decorativa pode ter alt vazio; uma foto de produto precisa de descrição útil. Não escreva características que a imagem não mostra. Dimensões informadas reduzem deslocamentos de layout.", "code": "\u003cimg src=\"img/camiseta-frente.jpg\" alt=\"Camiseta de estudo, vista frontal\" width=\"600\" height=\"750\">", "explain": "Crie a pasta img e use uma foto sua com esse nome ou adapte src ao arquivo real. O exemplo não baixa nem inventa uma foto.", "tasks": ["Copie uma foto autorizada para img.", "Ajuste sr executar uma variação e explicar o raciocínio. Explique quando escolheria Grid e quando escolheria Flexbox."}]}, {"id": 20, "theory": "Uma vitrine responsiva precisa equilibrar largura mínima dos cards e espaço disponível. auto-fit cria tantas colunas quanto couberem e distribui o restante. Uma largura mínima rígida maior que a tela quebra o layout; combine min() para limitar essa mínima.", "code": ".grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 15rem), 1fr)); gap: 1rem; }\n.produto { min-width: 0; }", "explain": "Cada coluna tenta ter no mínimo 15rem, mas nunca exige mais que 100% do espaço. Em telas largas aparecem várias colunas.", "tasks": ["Aplique a regra aos quatro cards.", "Reduza a largura até uma coluna.", "Adicione um produto e observe a redistribuição."], "expected": "A grade se reorganiza sem rolagem horizontal.", "bug": "Não fixe width:300px nos cards se a coluna precisa encolher.", "challenge": "Faça uma versão com largura mínima de 18rem e compare a leitura das fotos.", "question": "auto-fit ajuda a:", "choices": ["Ajustar a quantidade de colunas ao espaço", "Baixar fotos", "Validar formulário", "Executar JavaScript"], "title": "Grid 2: vitrine de produtos em grade", "minutes": 120, "quiz": [{"question": "auto-fit ajuda a:", "options": ["Ajustar a quantidade de colunas ao espaço", "Baixar fotos", "Validar formulário", "Executar JavaScript"], "answer": 0, "explanation": "Conceito: Cada coluna tenta ter no mínimo 15rem, mas nunca exige mais que 100% do espaço. Em telas largas aparecem várias colunas."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "A grade se reorganiza sem rolagem horizontal."], "answer": 3, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A grade ica."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Faça um segundo commit com uma melhoria de acessibilidade e mensagem específica."}]}, {"id": 27, "theory": "GitHub hospeda repositórios; Git mantém o histórico. O remoto é um endereço associado ao projeto. Autentique-se pelo fluxo oficial do GitHub, sem colocar token em arquivos. Um README deve explicar finalidade, execução e limites. Trabalhe em um repositório de estudo separado da produção.", "code": "git branch -M main\ngit remote add origin https://github.com/SEU-USUARIO/blessaint-estudo.git\ngit push -u origin main", "explain": "Substitua SEU-USUARIO pelo seu nome e crie primeiro o repositório vazio. Se origin já existe, inspecione git remote -v em vez de adicioná-lo novamente.", "tasks": ["Crie o repositório de estudo no GitHub.", "Escreva README com instrução de abertura e recursos implementados.", "Conecte o remoto e envie o commit, usando autenticação oficial."], "expected": "O commit e os arquivos aparecem no repositório correto.", "bug": "Um push rejeitado pode indicar histórico remoto diferente; leia o erro e não force sobrescrita.", "challenge": "Peça a outra pessoa para seguir o README e abrir o projeto.", "question": "Qual é a diferença principal entre Git e GitHub?", "choices": ["Git versiona; GitHub hospeda repositórios", "São o mesmo programa", "Git exige internet sempre", "GitHub substitui HTML"], "title": "GitHub: conta, repositório, push e README", "minutes": 120, "quiz": [{"question": "Qual é a diferença principal entre Git e GitHub?", "options": ["GitHub substitui HTML", "Git versiona; GitHub hospeda repositórios", "São o mesmo programa", "Git exige internet sempre"], "answer": 1, "explanation": "Conceito: Substitua SEU-USUARIO pelo seu nome e crie primeiro o repositório vazio. Se origin já existe, inspecione git remote -v em vez de adicioná-lo novamente."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["O commit e o mesmo comportamento em todas as larguras antes de adicionar variações.", "code": "// HTML: \u003cbutton id=\"menu-btn\" aria-expanded=\"false\" aria-controls=\"menu\">Menu\u003c/button>\n// \u003cnav id=\"menu\" hidden>...links completos...\u003c/nav>\nconst botaoMenu = document.querySelector(\"#menu-btn\");\nconst menu = document.querySelector(\"#menu\");\nbotaoMenu.addEventListener(\"click\", () => {\n const aberto = botaoMenu.getAttribute(\"aria-expanded\") === \"true\";\n botaoMenu.setAttribute(\"aria-expanded\", String(!aberto));\n menu.hidden = aberto;\n});", "explain": "Troque os comentários pelo HTML real; preserve seus links. CSS como nav{display:flex} pode sobrepor hidden, então adicione [hidden]{display:none!important} como regra de utilidade explícita.", "tasks": ["Crie botão e nav com ids correspondentes.", "Implemente o listener e a regra hidden.", "Teste abrir, fechar e percorrer links pelo teclado."], "expected": "O menu e aria-expanded refletem o mesmo estado.", "bug": "Mudar só a classe visual deixa o estado acessível desatualizado.", "challenge": "Feche o menu ao pressionar Escape e devolva o foco ao botão.", "question": "aria-expanded deve acompanhar:", "choices": ["O estado aberto ou fechado", "O preço", "A fonte", "O número de produtos"], "title": "Menu mobile funcionando com classList.toggle", "minutes": 120, "quiz": [{"question": "aria-expanded deve acompanhar:", "options": ["A fonte", "O número de produtos", "O estado aberto ou fechado", "O preço"], "answer": 2, "explanation": "Conceito: Troque os comentários pelo HTML real; preserve seus links. CSS como nav{display:flex} pode sobrepor hidden, então adicione [hidden]{display:none!important} como regra de utilidade explícita."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "O menu e aria-expanded refletem o mesmo estado.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página ulário orienta erros e não finge uma transmissão real.", "bug": "Validação só no navegador não protege uma API que aceita dados inválidos diretamente.", "challenge": "Exija pelo menos dez caracteres na mensagem e explique a correção ao usuário.", "question": "Onde regras importantes também devem ser validadas?", "choices": ["No servidor", "Somente no CSS", "Somente no placeholder", "Somente no ícone"], "title": "Validação do formulário de contato com JS", "minutes": 120, "quiz": [{"question": "Onde regras importantes também devem ser validadas?", "options": ["Somente no placeholder", "Somente no ícone", "No servidor", "Somente no CSS"], "answer": 2, "explanation": "Conceito: Adicione \u003cp id=\"retorno\" role=\"status\">\u003c/p> ao formulário da aula 7. FormData usa name dos campos. Não registre mensagens reais em logs."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "O formulário orienta erros e não finge uma transmissão real.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento."], "answer": 1, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O formulário orienta erros e não finge uma transmissão real."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Validação só no navegador não protege uma API que aceita dados inválidos diretamente.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída."], "answer": 0, "explanation": "Este diagnóstico ajuda a localizar a causa. Validação só no navegador não protege uma API que aceita dados inválidos diretamente."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Exija pelo menos dez caracteres na mensagem e explique a correção ao usuário."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Exija pelo menos dez caracteres na mensagem e explique a correção ao usuário."}]}, {"id": 47, "theory": "localStorage guarda strings por origem do navegador. JSON.stringify serializa dados e JSON.parse os reconstrói. Esse armazenamento não sincroniza aparelhos e pode estar bloqueado ou conter dados inválidos. Nunca o trate como estoque oficial nem guarde segredos nele.", "code": "function lerCarrinho() {\n try {\n  const valor = JSON.parse(localStorage.getItem(\"bls-carrinho\") || \"[]\");\n  return Array.isArray(valor) ? valor : [];\n } catch { return []; }\n}\nlocalStorage.setItem(\"bls-carrinho\", JSON.stringify([]));", "explain": "O teste Array.isArray confirma apenas a estrutura externa; cada item também precisará ser validado antes de uso. O setItem do exemplo grava uma lista vazia: execute só no armazenamento de estudo.", "tasks": ["Salve uma lista demonstrativa e recarregue.", "Leia a lista no console.", "Teste JSON inválido em ambiente de estudo e confira a recuperação."], "expected": "O carrinho reaparece no mesmo navegador e dados quebrados não derrubam a página.", "bug": "JSON.parse pode lançar erro; não deixe uma gravação antiga impedir toda a inicialização.", "challenge": "Valide id e quantidade de cada item recuperado e descarte os inválidos.", "question": "localStorage sincroniza automaticamente celular e computador?", "choices": ["Não", "Sim, pelo mesmo nome", "Sim, se usar const", "Somente com CSS"], "title": "localStorage: salvando dados no navegador", "minutes": 120, "quiz": [{"question": "localStorage sincroniza automaticamente celular e computador?", "options": ["Somente com CSS", "Não", "Sim, pelo mesmo nome", "Sim, se usar const"], "answer": 1, "explanation": "Conceito: O te ar e não confie no preço enviado pelo cliente para uma venda real.", "code": "let carrinho = [];\nfunction adicionar(id, tamanho) {\n const produto = produtos.find(p => p.id === id);\n if (!produto || ![\"P\",\"M\",\"G\",\"GG\"].includes(tamanho)) return;\n const item = carrinho.find(i => i.id === id && i.tamanho === tamanho);\n if (item) item.qtd += 1;\n else carrinho.push({id, tamanho, qtd: 1});\n}", "explain": "O exemplo usa variantes por tamanho; inclua cor na chave quando acrescentar cores. Salve e renderize após a alteração.", "tasks": ["Implemente a função e chame com um id real da lista.", "Adicione duas vezes o mesmo tamanho.", "Adicione outro tamanho e compare as entradas."], "expected": "Mesmo produto/tamanho soma quantidade; outro tamanho vira item separado.", "bug": "Usar só id mistura tamanhos e cores diferentes na mesma entrada.", "challenge": "Acrescente cor à identidade do item e teste duas combinações.", "question": "A chave do item deve distinguir:", "choices": ["Produto e variante", "Só o título da página", "Só o preço", "Só a posição visual"], "title": "Carrinho simulado 1: adicionar itens", "minutes": 120, "quiz": [{"question": "A chave do item deve distinguir:", "options": ["Produto e variante", "Só o título da página", "Só o preço", "Só a posição visual"], "answer": 0, "explanation": "Conceito: O exemplo usa variantes por tamanho; inclua cor na chave quando acrescentar cores. Salve e renderize após a alteração."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "Mesmo produto/tamanho soma quantidade; outro tamanho vira item separado."], "answer": 3, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. Mesmo produto/tamanho soma quantidade; outro tamanho vira item separado."}, {"question": "Qual rrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Monte uma mensagem de resumo e codifique com encodeURIComponent para abrir WhatsApp, sem enviá-la automaticamente."}]}, {"id": 50, "theory": "Concluir a vitrine exige mostrar o fluxo inteiro e saber modificá-lo. Seu projeto deve ter catálogo, detalhes, frente/costas acessível, busca, carrinho demonstrativo e contato claro. Publique o ambiente de estudo e faça uma demonstração sem consultar cada linha do tutorial.", "code": "Entrega BLESSAINT 1.0:\n1. URL e repositório\n2. README de execução\n3. testes de teclado/celular\n4. dados e preços identificados como estudo\n5. alteração independente explicada", "explain": "Esta é a conclusão do site vitrine; a formação continua com dados remotos, componentes e servidor. Certifique-se de que o carrinho não promete pagamento ou estoque real.", "tasks": ["Execute o fluxo completo e anote falhas.", "Corrija e publique apenas o projeto de estudo.", "Apresente uma mudança nova e explique seus testes."], "expected": "Outra pessoa consegue abrir, navegar e reproduzir o fluxo descrito no README.", "bug": "Uma captura de tela não comprova funcionamento; inclua testes de interação.", "challenge": "Sem copiar, implemente ordenação por preço e demonstre que a busca continua funcionando.", "question": "O que evidencia autonomia nesta entrega?", "choices": ["Implementar uma mudança e explicar decisões e testes", "Ter muitas linhas", "Copiar tudo", "Somente publicar uma imagem"], "title": "Revisão final + publicar BLESSAINT versão 1.0", "minutes": 120, "quiz": [{"question": "O que evidencia autonomia nesta entrega?", "options": ["Copiar tudo", "Somente publicar uma imagem", "Implementar uma mudança e explicar decisões e testes", "Ter muitas linhas"], "answer": 2, "explanation": "Conceito: Esta é a conclusão do site vitrine; a formação continua com dados remotos, componentes e servidor. Certifique-se de que o carrinho não promete pag N inválido."], "answer": 3, "explanation": "Este diagnóstico ajuda a localizar a causa. Uma vírgula após o último item ou uma chave sem aspas torna o JSON inválido."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Acrescente variantes e escreva como rejeitaria um preço em texto.", "Copiar o exemplo sem executar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Acrescente variantes e escreva como rejeitaria um preço em texto."}]}, {"id": 52, "theory": "HTTP é uma troca de requisição e resposta. GET consulta dados; o status informa o resultado. fetch retorna uma promessa e não rejeita automaticamente em todo erro HTTP: verifique response.ok. Como a resposta chega depois, modele estados de carregamento, sucesso, vazio e erro.", "code": "async function carregar() {\n try {\n  const resposta = await fetch(\"produtos.json\");\n  if (!resposta.ok) throw new Error(\"HTTP \" + resposta.status);\n  const lista = await resposta.json();\n  if (!Array.isArray(lista)) throw new Error(\"Formato inválido\");\n  renderizar(lista);\n } catch (erro) {\n  document.querySelector(\"#mensagem-colecao\").textContent = \"Não foi possível carregar. Tente novamente.\";\n }\n}\ncarregar();", "explain": "Use servidor local, como Live Server, em vez de file://. A validação do array é apenas o começo; valide cada produto antes de aceitar dados externos.", "tasks": ["Sirva o projeto por HTTP local.", "Carregue produtos.json e mostre carregamento antes da requisição.", "Renomeie o arquivo para provocar 404 e teste o erro."], "expected": "A lista aparece no sucesso e uma mensagem compreensível aparece no erro.", "bug": "fetch pode resolver normalmente com resposta 404; sem checar ok você pode tratar erro como sucesso.", "challenge": "Adicione botão Tentar novamente e estado vazio.", "question": "f  explicar o raciocínio. Adicione botão Tentar novamente e estado vazio."}]}, {"id": 53, "theory": "Promessas representam resultados futuros. await espera uma promessa dentro de função async sem bloquear toda a página. Requisições de busca podem chegar fora de ordem: uma resposta antiga não deve substituir uma busca nova. AbortController permite cancelar trabalho que perdeu relevância.", "code": "let controle;\nasync function buscarCatalogo() {\n controle?.abort();\n controle = new AbortController();\n try {\n  const r = await fetch(\"produtos.json\", {signal: controle.signal});\n  if (!r.ok) throw new Error(\"Falha HTTP\");\n  const dados = await r.json();\n  renderizar(dados);\n } catch (e) { if (e.name !== \"AbortError\") console.error(\"Falha no catálogo\"); }\n}", "explain": "O cancelamento esperado não precisa aparecer como falha ao usuário. Para uma busca por termo, passe o termo ao servidor e mantenha a mesma proteção contra respostas antigas.", "tasks": ["Dispare duas chamadas rapidamente.", "Simule rede lenta nas ferramentas do navegador.", "Observe a requisição cancelada e a última resposta."], "expected": "A chamada mais recente prevalece e cancelamento não vira alerta de erro.", "bug": "Confundir qualquer cancelamento com indisponibilidade gera mensagens desnecessárias.", "challenge": "Explique quando usaria Promise.all para duas consultas independentes.", "question": "Por que cancelar uma busca anterior?", "choices": ["Para evitar trabalho e respostas que perderam relevância", "Para apagar o banco", "Para aumentar o atraso", "Para mudar o HTML"], "title": "Assincronismo e cancelamento", "minutes": 180, "quiz": [{"question": "Por que cancelar uma busca anterior?", "options": ["Para apagar o banco", "Para aumentar o atraso", "Para mudar o HTML", "Para evitar trabalho e respostas que perderam relevância"], "answer": 3, "explanation": "Conceito: O cancelamento esperado não precisa aparecer como falha ao usuário. Para uma busca por termo, passe o termo ao servidor e mantenha a mesma proteção contra respostas antigas."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "A chamada mais recente prevalece e cancelamento não vira alerta de erro.", "Apenas que o arquivo foi salvo, sem executar o cenário."], "answer": 2, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A chamada mais recente prevalece e cancelamento não vira alerta de erro."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Ignorar os erros e marcar a prática como concluída.", "Confundir qualquer cancelamento com indisponibilidade gera mensagens desnecessárias.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações."], "answer": 1, "explanation": "Este diagnóstico ajuda a localizar a causa. Confundir qualquer cancelamento com indisponibilidade gera mensagens desnecessárias."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Explique quando usaria Promise.all para duas consultas independentes.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Explique quando usaria Promise.all para duas consultas independentes."}]}, {"id": 54, "theory": "Módulos limitam responsabilidades e nomes globais. export torna uma função disponível e import a consome. Arquivos de módulo são carregados por HTTP e seus caminhos precisam ser explícitos no navegador. Faça refatoração em pequenos passos: preserve comportamento e teste depois de cada extração.", "code": "// calculos.js\nexport function subtotal(preco, qtd) { return preco * qtd; }\n// script.js\nimport { subtotal } from \"./calculos.js\";\nconsole.log(subtotal(10000, 2));\n// HTML: \u003cscript type=\"module\" src=\"script.js\">\u003c/script>", "explain": "Cada trecho vai no arquivo indicado. O exemplo mínimo omite validações apenas para destacar import/export; preserve a versão validada da aula 34 no projeto.", "tasks": ["Extraia a função de cálculo para calculos.js.", "Carregue script.js como módulo.", "Refaça o fluxo do carrinho e compare o resultado."], "expected": "O total permanece correto após a organização em arquivos.", "bug": "Importar de calculos.js sem ./ pode ser interpretado como nome de pacote por ferramentas, não como arquivo relativo.", "challenge": "Separe dados, cálculo e renderização em módulos sem criar dependências circulares.", "question": "Qual palavra disponibiliza uma função a outro módulo?", "choices": ["export", "publicar", "window sempre", "return sozinho"], "title": "Módulos e arquitetura JavaScript", "minutes": 180, "quiz": [{"question": "Qual palavra disponibiliza uma função a outro módulo?", "options": ["window sempre", "return sozinho", "export", "publicar"], "answer": 2, "explanation": "Conceito: Cada trecho vai no arquivo indicado. O exemplo mínimo omite validações apenas para destacar import/export; preserve a versão validada da aula 34 no projeto."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "O total permanece correto após a organização em arquivos.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento."], "answer": 1, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O total permanece correto após a organização em arquivos."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Importar de calculos.js sem ./ pode ser interpretado como nome de pacote por ferramentas, não como arquivo relativo.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída."], "answer": 0, "explanation": "Este diagnóstico ajuda a localizar a causa. Importar de calculos.js sem ./ pode ser interpretado como nome de pacote por ferramentas, não como arquivo relativo."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Separe dados, cálculo e renderização em módulos sem criar dependências circulares."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Separe dados, cálculo e renderização em módulos sem criar dependências circulares."}]}, {"id": 55, "theory": "TypeScript adiciona verificação estática de tipos ao JavaScript. Ele ajuda a encontrar incompatibilidades durante desenvolvimento, mas tipos não validam automaticamente uma resposta de rede em execução. Comece em um projeto de estudo com ferramentas locais e preserve o JavaScript funcionando.", "code": "type Produto = { id: string; nome: string; preco: number };\nfunction precoEmReais(produto: Produto): number {\n return produto.preco / 100;\n}\nconst exemplo: Produto = {id:\"nuvem\", nome:\"Nuvem\", preco:10000};", "explain": "Use npm init -y e npm install --save-dev typescript numa pasta nova após instalar Node LTS. Salve em tipos.ts e execute npx tsc tipos.ts --noEmit. Troque preco por texto para observar o diagnóstico.", "tasks": ["Crie a pasta de estudo de tipos.", "Execute a verificação do exemplo válido.", "Introduza um preço string e leia o erro; depois corrija."], "expected": "A verificação aceita o número e aponta a incompatibilidade de texto.", "bug": "Uma declaração de tipo não transforma um JSON externo inválido em dado válido.", "challen ar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Modele ItemCarrinho com quantidade e tamanho, incluindo tamanhos permitidos."}]}, {"id": 56, "theory": "React organiza a interface em componentes. Um componente recebe propriedades e retorna descrição da UI. JSX parece HTML, mas está dentro do JavaScript e usa regras próprias, como className. Primeiro migre um card, sem reescrever toda a loja de uma vez.", "code": "type Produto = { id: string; nome: string; preco: number };\nfunction Card({produto}: {produto: Produto}) {\n return \u003carticle>\u003ch2>{produto.nome}\u003c/h2>\u003cp>{(produto.preco/100).toFixed(2)}\u003c/p>\u003c/article>;\n}\nexport default function App() {\n return \u003cCard produto={{id:\"nuvem\",nome:\"Nuvem\",preco:10000}} />;\n}", "explain": "Em pasta nova, crie um projeto de estudo com npm create vite@latest blessaint-react -- --template react-ts; entre na pasta, npm install e npm run dev. Substitua src/App.tsx pelo exemplo. Confira requisitos da versão instalada se o terminal apontar incompatibilidade.", "tasks": ["Crie o ambiente React de estudo.", "Execute o Card com dados demonstrativos.", "Passe outro produto por propriedade."], "expected": "O mesmo componente apresenta dados diferentes sem duplicar a estrutura.", "bug": "Copiar JSX para um HTML sem compilação não o torna um componente React executável.", "challenge": "Renderize uma lista de cards usando key estável por produto.", "question": "O que props permite?", "choices": ["Passar dados ao componente", "Criar banco automaticamente", "Esconder segredo no navegador", "Substituir todo JavaScript"], "title": "React: componentes e propriedades", "minutes": 180, "quiz": [{"question": "O que props permite?", "options": ["Passar dados ao componente", "Criar banco automaticamente", "Esconder segredo no navegador", "Substituir todo JavaScript"], "answer": 0, "explanation": "Conceito: Em pasta nova, crie um projeto de estudo com npm create vite@latest blessaint-react -- --template react-ts; entre na pasta, npm install e npm run dev. Substitua src/App.tsx pelo exemplo. Confira requisitos da versão instalada se o terminal apontar incompatibilidade."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "O mesmo componente apresenta dados diferentes sem duplicar a estrutura."], "answer": 3, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O mesmo componente apresenta dados diferentes sem duplicar a estrutura."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Copiar JSX para um HTML sem compilação não o torna um componente React executável.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos."], "answer": 2, "explanation": "Este diagnóstico ajuda a localizar a causa. Copiar JSX para um HTML sem compilação não o torna um componente React executável."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Trocar apenas o título da página e encerrar o módulo.", "Renderize uma lista de cards usando key estável por produto.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar."], "answer": 1, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Renderize uma lista de cards usando key estável por produto."}]}, {"id": 57, "theory": "Estado guarda valores que mudam e afetam a tela. Em React, use o setter para solicitar nova renderização. Atualizações baseadas no valor anterior ficam mais seguras com função atualizadora. Evite mutar arrays de estado diretamente, pois isso pode impedir atualizações previsíveis.", "code": "import {useState} from \"react\";\nexport default function Quantidade() {\n const [qtd, setQtd] = useState(1);\n return \u003cdiv>\u003cbutton onClick={() => setQtd(q => Math.max(1, q - 1))}>Diminuir\u003c/button>\u003coutput>{qtd}\u003c/output>\u003cbutton onClick={() => setQtd(q => q + 1)}>Aumentar\u003c/button>\u003c/div>;\n}", "explain": "useState cria o estado e o setter. Math.max mantém o mínimo em 1. A função q => q+1 usa o valor anterior recebido pelo React.", "tasks": ["Execute o componente no projeto React.", "Teste vários incrementos e decrementos.", "Acrescente um limite máximo de dez."], "expected": "A tela acompanha a quantidade sem permitir valor abaixo de um.", "bug": "Alterar uma variável comum não solicita renderização; use estado para dados visíveis mutáveis.", "challenge": "Reconstrua o carrinho com estado, mantendo produto e variante separados.", "question": "Como atualizar um array de estado com novo item?", "choices": ["Criar novo array e chamar o setter", "Usar push e ignorar o setter", "Editar o DOM diretamente", "Recarregar a página sempre"], "title": "React: estado e carrinho", "minutes": 180, "quiz": [{"question": "Como atualizar um array de estado com novo item?", "options": ["Usar push e ignorar o setter", "Editar o DOM diretamente", "Recarregar a página sempre", "Criar novo array e chamar o setter"], "answer": 3, "explanation": "Conceito: useState cria o estado e o setter. Math.max mantém o mínimo em 1. A função q => q+1 usa o valor anterior recebido pelo React."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "A tela acompanha a quantidade sem permitir valor abaixo de um.", "Apenas que o arquivo foi salvo, sem executar o cenário."], "answer": 2, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A tela acompanha a quantidade sem permitir valor abaixo de um."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Ignorar os erros e marcar a prática como concluída.", "Alterar uma variável comum não solicita renderização; use estado para dados visíveis mutáveis.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações."], "answer": 1, "explanation": "Este diagnóstico ajuda a localizar a causa. Alterar uma variável comum não solicita renderização; use estado para dados visíveis mutáveis."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Reconstrua o carrinho com estado, mantendo produto e variante separados.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Reconstrua o carrinho com estado, mantendo produto e variante separados."}]}, {"id": 58, "theory": "Efeitos sincronizam componentes com sistemas externos. Uma consulta de rede precisa de tratamento de erro e limpeza quando o componente deixa de existir ou os parâmetros mudam. Não use efeito para calcular um filtro que pode ser derivado diretamente do estado. Dependências descrevem os valores usados pela sincronização.", "code": "import {useEffect, useState} from \"react\";\nexport default function Catalogo() {\n const [nomes,setNomes] = useState\u003cstring[]>([]);\n const [erro,setErro] = useState(\"\");\n useEffect(() => {\n  const c = new AbortController();\n  fetch(\"/produtos.json\",{signal:c.signal}).then(r => {if(!r.ok) throw Error(); return r.json();}).then(d => setNomes(d.map((p:{nome:string}) => p.nome))).catch(e => {if(e.name!==\"AbortError\") setErro(\"Falha ao carregar\");});\n  return () => c.abort();\n },[]);\n return \u003cdiv>{erro || nomes.join(\", \")}\u003c/div>;\n}", "explain": "Coloque o JSON em public/produtos.json no projeto local. Em publicação sob subpasta, use o caminho base configurado. Complete validação dos objetos antes de usar dados externos.", "tasks": ["Carregue o catálogo em um componente.", "Teste falha de rede.", "Separe carregamento, erro, vazio e sucesso na interface."], "expected": "A UI trata a resposta e cancelamento sem tentar usar um componente encerrado.", "bug": "Um efeito sem dependências adequadas pode consultar repetidamente ou usar valores antigos.", "challenge": "Divida a tela em catálogo e detalhes, preservando estado do carrinho no ancestral comum.", "question": "Para que serve a função retornada pelo efeito?", "choices": ["Limpar a sincronização, como cancelar a requisição", "Renderizar JSX", "Criar CSS", "Validar senha"], "title": "React: efeitos e integração", "minutes": 180, "quiz": [{"question": "Para que serve a função retornada pelo efeito?", "options": ["Criar CSS", "Validar senha", "Limpar a sincronização, como cancelar a requisição", "Renderizar JSX"], "answer": 2, "explanation": "Conceito: Coloque o JSON em public/produtos.json no projeto local. Em publicação sob subpasta, use o caminho base configurado. Complete validação dos objetos antes de usar dados externos."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "A UI trata a resposta e cancelamento sem tentar usar um componente encerrado.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento."], "answer": 1, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A UI trata a resposta e cancelamento sem tentar usar um componente encerrado."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Um efeito sem dependências adequadas pode consultar repetidamente ou usar valores antigos.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída."], "answer": 0, "explanation": "Este diagnóstico ajuda a localizar a causa. Um efeito sem dependências adequadas pode consultar repetidamente ou usar valores antigos."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Divida a tela em catálogo e detalhes, preservando estado do carrinho no ancestral comum."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Divida a tela em catálogo e detalhes, preservando estado do carrinho no ancestral comum."}]}, {"id": 59, "theory": "O servidor recebe requisições e responde independentemente do navegador. Node executa JavaScript fora da página. O exemplo usa HTTP nativo para tornar o ciclo visível. Endereços locais são para desenvolvimento; não exponha um servidor didático como uma loja pronta.", "code": "// server.mjs\nimport {createServer} from \"node:http\";\nconst server = createServer((req,res) => {\n res.setHeader(\"Content-Type\",\"application/json; charset=utf-8\");\n if(req.method === \"GET\" && req.url === \"/api/produtos\") {\n  res.end(JSON.stringify([{id:\"nuvem\",nome:\"Nuvem\",preco:10000}]));\n } else { res.statusCode=404; res.end(JSON.stringify({erro:\"Não encontrado\"})); }\n});\nserver.listen(3000,\"127.0.0.1\");", "explain": "Instale Node LTS, salve server.mjs e execute node server.mjs no terminal. Abra http://127.0.0.1:3000/api/produtos. Ctrl+C encerra o processo.", "tasks": ["Inicie o servidor local.", "Consulte a rota de produtos.", "Consulte uma rota inexistente e confira o status 404."], "expected": "A rota válida entrega JSON e a inválida responde 404.", "bug": "Porta em uso significa outro processo ocupando-a; encerre o seu anterior ou escolha outra porta.", "challenge": "Acrescente GET /api/saude retornando um estado de funcionamento.", "question": "Quem executa server.mjs neste exemplo?", "choices": ["Node no servidor local", "O CSS", "A tag img", "O banco de dados"], "title": "Node.js: seu primeiro servidor", "minutes": 180, "quiz": [{"question": "Quem executa server.mjs neste exemplo?", "options": ["O banco de dados", "Node no servidor local", "O CSS", "A tag img"], "answer": 1, "explanation": "Conceito: Instale Node LTS, salve server.mjs e execute node server.mjs no terminal. Abra http://127.0.0.1:3000/api/produtos. Ctrl+C encerra o processo."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["A rota válida entrega JSON e a inválida responde 404.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta."], "answer": 0, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A rota válida entrega JSON e a inválida responde 404."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Porta em uso significa outro processo ocupando-a; encerre o seu anterior ou escolha outra porta."], "answer": 3, "explanation": "Este diagnóstico ajuda a localizar a causa. Porta em uso significa outro processo ocupando-a; encerre o seu anterior ou escolha outra porta."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Acrescente GET /api/saude retornando um estado de funcionamento.", "Copiar o exemplo sem executar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Acrescente GET /api/saude retornando um estado de funcionamento."}]}, {"id": 60, "theory": "Uma API precisa de contrato: método, caminho, entrada, resposta e erros. GET consulta; POST costuma criar; PATCH altera parte; DELETE remove. Valide conteúdo e imponha limite de corpo para não aceitar entrada ilimitada. Códigos HTTP devem corresponder ao resultado, sem vazar detalhes internos.", "code": "function validarProduto(p) {\n return !!p && typeof p.id === \"string\" && /^[a-z0-9-]{1,40}$/.test(p.id)\n  && typeof p.nome === \"string\" && p.nome.trim().length > 0\n  && Number.isSafeInteger(p.preco) && p.preco >= 0;\n}\nconsole.log(validarProduto({id:\"nuvem\",nome:\"Nuvem\",preco:10000}));", "explain": "Implemente POST lendo o corpo por partes, limitando a 16 KiB, convertendo JSON em try/catch e validando antes de gravar. A oficina server-demo.mjs nos materiais contém uma implementação local completa para comparar depois da tentativa.", "tasks": ["Documente POST /api/produtos e os erros 400,409,413 e 415.", "Implemente a rota no servidor de estudo.", "Teste JSON inválido, id duplicado e preço negativo."], "expected": "Entrada inválida não é aceita e criação válida responde 201.", "bug": "Confiar no formulário deixa chamadas diretas à API sem proteção.", "challenge": "Acrescente uma validação de nome com comprimento máximo e teste as duas fronteiras.", "question": "Por que validar no servidor?", "choices": ["O cliente pode ser contornado", "O CSS não tem cor", "GET não existe", "O navegador sempre valida tudo"], "title": "API: contratos e validação", "minutes": 180, "quiz": [{"question": "Por que validar no servidor?", "options": ["O cliente pode ser contornado", "O CSS não tem cor", "GET não existe", "O navegador sempre valida tudo"], "answer": 0, "explanation": "Conceito: Implemente POST lendo o corpo por partes, limitando a 16 KiB, convertendo JSON em try/catch e validando antes de gravar. A oficina server-demo.mjs nos materiais contém uma implementação local completa para comparar depois da tentativa."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "Entrada inválida não é aceita e criação válida responde 201."], "answer": 3, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. Entrada inválida não é aceita e criação válida responde 201."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Confiar no formulário deixa chamadas diretas à API sem proteção.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos."], "answer": 2, "explanation": "Este diagnóstico ajuda a localizar a causa. Confiar no formulário deixa chamadas diretas à API sem proteção."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Trocar apenas o título da página e encerrar o módulo.", "Acrescente uma validação de nome com comprimento máximo e teste as duas fronteiras.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar."], "answer": 1, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Acrescente uma validação de nome com comprimento máximo e teste as duas fronteiras."}]}, {"id": 61, "theory": "Banco relacional organiza entidades em tabelas. Chave primária identifica cada linha; restrições protegem invariantes. Dinheiro em centavos inteiros evita arredondamento binário no armazenamento. Use banco de estudo separado. PostgreSQL pode ser instalado localmente; execute o SQL em seu editor SQL conectado ao banco de estudo.", "code": "CREATE TABLE produtos (\n id text PRIMARY KEY,\n nome text NOT NULL,\n preco integer NOT NULL CHECK (preco >= 0)\n);\nINSERT INTO produtos (id,nome,preco) VALUES ('nuvem','Nuvem',10000);\nSELECT id,nome,preco FROM produtos ORDER BY nome;", "explain": "CREATE cria a estrutura; INSERT acrescenta linha; SELECT consulta sem alterar. Repita o INSERT para observar a proteção contra id duplicado.", "tasks": ["Instale PostgreSQL e crie banco blessaint_estudo.", "Execute a criação e a inserção.", "Tente duplicar o id e inserir preço negativo."], "expected": "A consulta retorna a peça; as restrições rejeitam os dados inválidos.", "bug": "Não use o banco real para experimentar DELETE ou alterar estruturas.", "challenge": "Crie uma tabela de categorias com identificador próprio.", "question": "Qual restrição impede id duplicado?", "choices": ["PRIMARY KEY", "ORDER BY", "SELECT", "Nome da tabela"], "title": "SQL: persistência e restrições", "minutes": 180, "quiz": [{"question": "Qual restrição impede id duplicado?", "options": ["ORDER BY", "SELECT", "Nome da tabela", "PRIMARY KEY"], "answer": 3, "explanation": "Conceito: CREATE cria a estrutura; INSERT acrescenta linha; SELECT consulta sem alterar. Repita o INSERT para observar a proteção contra id duplicado."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "A consulta retorna a peça; as restrições rejeitam os dados inválidos.", "Apenas que o arquivo foi salvo, sem executar o cenário."], "answer": 2, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A consulta retorna a peça; as restrições rejeitam os dados inválidos."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Ignorar os erros e marcar a prática como concluída.", "Não use o banco real para experimentar DELETE ou alterar estruturas.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações."], "answer": 1, "explanation": "Este diagnóstico ajuda a localizar a causa. Não use o banco real para experimentar DELETE ou alterar estruturas."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Crie uma tabela de categorias com identificador próprio.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Crie uma tabela de categorias com identificador próprio."}]}, {"id": 62, "theory": "Relacionamentos evitam repetir dados inconsistentes. Uma variante pertence a um produto e combina tamanho e cor. Chave estrangeira aponta para uma linha existente; UNIQUE impede duplicação da combinação. JOIN reúne dados relacionados em uma consulta.", "code": "CREATE TABLE variantes (\n id integer GENERATED ALWAYS AS IDENTITY PRIMARY KEY,\n produto_id text NOT NULL REFERENCES produtos(id),\n tamanho text NOT NULL, cor text NOT NULL,\n UNIQUE(produto_id,tamanho,cor)\n);\nINSERT INTO variantes(produto_id,tamanho,cor) VALUES ('nuvem','M','branca');\nSELECT p.nome,v.tamanho,v.cor FROM produtos p JOIN variantes v ON v.produto_id=p.id;", "explain": "O id da variante não é o mesmo id do produto. O JOIN usa a relação explicitamente, evitando combinar todas as linhas indiscriminadamente.", "tasks": ["Crie variantes após produtos.", "Insira duas combinações para a mesma peça.", "Tente referenciar um produto inexistente."], "expected": "A consulta reúne peça e variante; referência inválida é rejeitada.", "bug": "Copiar o nome da peça para cada variante cria duplicação quando o nome muda.", "challenge": "Acrescente uma restrição de tamanhos permitidos e teste valor inválido.", "question": "Uma chave estrangeira ajuda a garantir:", "choices": ["Que a referência a outra tabela seja válida", "Que o CSS carregue", "Que o login seja automático", "Que a imagem exista"], "title": "Relacionamentos e variantes", "minutes": 180, "quiz": [{"question": "Uma chave estrangeira ajuda a garantir:", "options": ["Que o login seja automático", "Que a imagem exista", "Que a referência a outra tabela seja válida", "Que o CSS carregue"], "answer": 2, "explanation": "Conceito: O id da variante não é o mesmo id do produto. O JOIN usa a relação explicitamente, evitando combinar todas as linhas indiscriminadamente."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "A consulta reúne peça e variante; referência inválida é rejeitada.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento."], "answer": 1, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A consulta reúne peça e variante; referência inválida é rejeitada."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Copiar o nome da peça para cada variante cria duplicação quando o nome muda.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída."], "answer": 0, "explanation": "Este diagnóstico ajuda a localizar a causa. Copiar o nome da peça para cada variante cria duplicação quando o nome muda."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Acrescente uma restrição de tamanhos permitidos e teste valor inválido."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Acrescente uma restrição de tamanhos permitidos e teste valor inválido."}]}, {"id": 63, "theory": "Uma aplicação consulta o banco por um driver, mantendo segredo de conexão no servidor. Consultas parametrizadas separam comando e dados; concatenar entrada em SQL pode permitir injeção. Migrações registram mudanças de estrutura. Uma transação permite confirmar um conjunto de alterações ou desfazê-lo por inteiro.", "code": "// db.mjs: npm install pg\nimport pg from \"pg\";\nconst pool = new pg.Pool({connectionString:process.env.DATABASE_URL});\nexport async function encontrarProduto(id) {\n const r = await pool.query(\"SELECT id,nome,preco FROM produtos WHERE id=$1\",[id]);\n return r.rows[0] || null;\n}", "explain": "Configure DATABASE_URL apenas no ambiente local do servidor, sem gravar no repositório. No PowerShell, $env:DATABASE_URL recebe a conexão de estudo. Conecte a função à rota GET e retorne 404 quando vier null.", "tasks": ["Instale pg no projeto de servidor.", "Conecte a rota ao banco de estudo.", "Teste id normal e texto com aspas, verificando que ambos são tratados como dados."], "expected": "O catálogo persiste após reiniciar o servidor e entradas não mudam o comando SQL.", "bug": "Não envie DATABASE_URL para o navegador nem inclua a senha em logs.", "challenge": "Escreva uma transação com BEGIN/COMMIT e provoque erro para testar ROLLBACK.", "question": "O que $1 e a lista de valores evitam?", "choices": ["Misturar dados de entrada com o comando SQL", "Toda falha de rede", "Qualquer bug possível", "A necessidade de autorização"], "title": "Banco conectado e transações", "minutes": 180, "quiz": [{"question": "O que $1 e a lista de valores evitam?", "options": ["A necessidade de autorização", "Misturar dados de entrada com o comando SQL", "Toda falha de rede", "Qualquer bug possível"], "answer": 1, "explanation": "Conceito: Configure DATABASE_URL apenas no ambiente local do servidor, sem gravar no repositório. No PowerShell, $env:DATABASE_URL recebe a conexão de estudo. Conecte a função à rota GET e retorne 404 quando vier null."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["O catálogo persiste após reiniciar o servidor e entradas não mudam o comando SQL.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta."], "answer": 0, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O catálogo persiste após reiniciar o servidor e entradas não mudam o comando SQL."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Não envie DATABASE_URL para o navegador nem inclua a senha em logs."], "answer": 3, "explanation": "Este diagnóstico ajuda a localizar a causa. Não envie DATABASE_URL para o navegador nem inclua a senha em logs."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Escreva uma transação com BEGIN/COMMIT e provoque erro para testar ROLLBACK.", "Copiar o exemplo sem executar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Escreva uma transação com BEGIN/COMMIT e provoque erro para testar ROLLBACK."}]}, {"id": 64, "theory": "Autenticação identifica quem está fazendo a requisição; autorização decide o que essa pessoa pode fazer. Esconder um botão no navegador não protege uma rota. No projeto completo, use um provedor mantido de identidade e verifique sessão no servidor. Não invente armazenamento de senha ou criptografia.", "code": "function podeEditar(usuario) {\n return !!usuario && usuario.papel === \"admin\";\n}\nconsole.log(podeEditar(null));\nconsole.log(podeEditar({papel:\"leitor\"}));\nconsole.log(podeEditar({papel:\"admin\"}));", "explain": "As saídas são false,false,true. Esse exercício testa a política, não autentica ninguém. usuario deve vir de sessão verificada pelo servidor, nunca do corpo enviado pelo cliente. A integração de identidade é detalhada no roteiro de laboratório de autenticação.", "tasks": ["Implemente a política como função testável.", "Teste visitante, leitor e administrador.", "Ligue a checagem às rotas de escrita após obter a sessão validada."], "expected": "Visitante recebe 401; usuário sem permissão recebe 403; administrador pode editar.", "bug": "Aceitar papel:\"admin\" enviado pelo navegador deixa qualquer cliente se promover.", "challenge": "Teste uma requisição direta sem passar pela interface e confirme a recusa.", "question": "Ocultar o botão de edição é autorização suficiente?", "choices": ["Não; a rota deve verificar a permissão", "Sim", "Só no celular", "Só com CSS escuro"], "title": "Autenticação e autorização", "minutes": 180, "quiz": [{"question": "Ocultar o botão de edição é autorização suficiente?", "options": ["Não; a rota deve verificar a permissão", "Sim", "Só no celular", "Só com CSS escuro"], "answer": 0, "explanation": "Conceito: As saídas são false,false,true. Esse exercício testa a política, não autentica ninguém. usuario deve vir de sessão verificada pelo servidor, nunca do corpo enviado pelo cliente. A integração de identidade é detalhada no roteiro de laboratório de autenticação."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "Visitante recebe 401; usuário sem permissão recebe 403; administrador pode editar."], "answer": 3, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. Visitante recebe 401; usuário sem permissão recebe 403; administrador pode editar."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Aceitar papel:\"admin\" enviado pelo navegador deixa qualquer cliente se promover.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos."], "answer": 2, "explanation": "Este diagnóstico ajuda a localizar a causa. Aceitar papel:\"admin\" enviado pelo navegador deixa qualquer cliente se promover."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Trocar apenas o título da página e encerrar o módulo.", "Teste uma requisição direta sem passar pela interface e confirme a recusa.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar."], "answer": 1, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Teste uma requisição direta sem passar pela interface e confirme a recusa."}]}, {"id": 65, "theory": "Validação, autorização e saída segura são camadas diferentes. XSS acontece quando conteúdo não confiável é executado no contexto da página. Use textContent para texto e sanitização apropriada quando HTML for realmente necessário. CORS não é autenticação; liberar uma origem não concede identidade.", "code": "const entrada = \"\u003cimg src=x onerror=alert(1)>\";\nconst aviso = document.createElement(\"p\");\naviso.textContent = entrada;\ndocument.body.append(aviso);", "explain": "O texto deve aparecer literalmente, sem executar código. Use esta demonstração somente na página de estudo. Nunca copie entrada desconhecida para eval.", "tasks": ["Teste saída segura com texto contendo tags.", "Revise as rotas para validação e autorização.", "Retire segredos de arquivos públicos e confira logs."], "expected": "O texto é exibido sem execução e escrita continua restrita no servidor.", "bug": "CORS não impede um atacante de chamar sua API fora do navegador; a autorização continua necessária.", "challenge": "Liste três fronteiras de confiança do projeto e a validação em cada uma.", "question": "Qual prática é adequada para exibir texto externo?", "choices": ["textContent", "eval", "Concatenar em innerHTML", "Criar um script com a entrada"], "title": "Segurança nas fronteiras", "minutes": 180, "quiz": [{"question": "Qual prática é adequada para exibir texto externo?", "options": ["eval", "Concatenar em innerHTML", "Criar um script com a entrada", "textContent"], "answer": 3, "explanation": "Conceito: O texto deve aparecer literalmente, sem executar código. Use esta demonstração somente na página de estudo. Nunca copie entrada desconhecida para eval."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta.", "O texto é exibido sem execução e escrita continua restrita no servidor.", "Apenas que o arquivo foi salvo, sem executar o cenário."], "answer": 2, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. O texto é exibido sem execução e escrita continua restrita no servidor."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Ignorar os erros e marcar a prática como concluída.", "CORS não impede um atacante de chamar sua API fora do navegador; a autorização continua necessária.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações."], "answer": 1, "explanation": "Este diagnóstico ajuda a localizar a causa. CORS não impede um atacante de chamar sua API fora do navegador; a autorização continua necessária."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Liste três fronteiras de confiança do projeto e a validação em cada uma.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo."], "answer": 0, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Liste três fronteiras de confiança do projeto e a validação em cada uma."}]}, {"id": 66, "theory": "Testes automatizados confirmam comportamentos e ajudam a impedir regressões. Comece por lógica pura: subtotal, filtros e validação. Um teste deve falhar quando a regra é violada e passar quando a correção restaura o comportamento. Use valores de fronteira, não só o caminho feliz.", "code": "// subtotal.test.mjs\nimport test from \"node:test\";\nimport assert from \"node:assert/strict\";\nfunction subtotal(p,q){ if(!Number.isInteger(q)||q\u003c0) throw Error(); return p*q; }\ntest(\"calcula e rejeita quantidade inválida\",()=>{\n assert.equal(subtotal(10000,2),20000);\n assert.equal(subtotal(10000,0),0);\n assert.throws(()=>subtotal(10000,-1));\n});", "explain": "Execute node --test subtotal.test.mjs. Depois mova a função para um módulo e importe a função real; não mantenha uma cópia separada que possa divergir do projeto.", "tasks": ["Execute o teste e observe aprovação.", "Introduza um erro no cálculo e veja o teste falhar.", "Restaure e acrescente um caso de quantidade fracionária."], "expected": "A suíte detecta a regressão e confirma a correção.", "bug": "Testar uma cópia da função em vez da função usada pela aplicação pode dar falsa confiança.", "challenge": "Escreva testes para remover apenas a variante escolhida do carrinho.", "question": "Um teste útil deve:", "choices": ["Falhar quando o comportamento esperado quebra", "Passar sempre", "Testar só nomes de arquivos", "Evitar entradas inválidas"], "title": "Testes de lógica e regressões", "minutes": 180, "quiz": [{"question": "Um teste útil deve:", "options": ["Testar só nomes de arquivos", "Evitar entradas inválidas", "Falhar quando o comportamento esperado quebra", "Passar sempre"], "answer": 2, "explanation": "Conceito: Execute node --test subtotal.test.mjs. Depois mova a função para um módulo e importe a função real; não mantenha uma cópia separada que possa divergir do projeto."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Nenhum resultado: uma execução sem mensagem basta.", "A suíte detecta a regressão e confirma a correção.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento."], "answer": 1, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. A suíte detecta a regressão e confirma a correção."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Testar uma cópia da função em vez da função usada pela aplicação pode dar falsa confiança.", "Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída."], "answer": 0, "explanation": "Este diagnóstico ajuda a localizar a causa. Testar uma cópia da função em vez da função usada pela aplicação pode dar falsa confiança."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Escreva testes para remover apenas a variante escolhida do carrinho."], "answer": 3, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Escreva testes para remover apenas a variante escolhida do carrinho."}]}, {"id": 67, "theory": "Testes de integração verificam partes conversando: rota, validação e banco. Testes de ponta a ponta reproduzem a jornada no navegador. Use banco e dados de teste próprios, preparando e limpando somente os registros de teste. Uma suíte não deve alterar dados da loja real.", "code": "Matriz de integração:\nGET catálogo → 200 e lista\nPOST inválido → 400 e nenhuma gravação\nPOST sem sessão → 401\nPOST leitor → 403\nPOST administrador válido → 201\nJornada: buscar → escolher variante → carrinho → remover", "explain": "Automatize chamadas HTTP com fetch e assert no ambiente de teste. Para navegador, use ferramenta de teste instalada no projeto, mantendo seletores por rótulo ou função acessível em vez de posições frágeis.", "tasks": ["Prepare dados de teste identificados.", "Execute a matriz contra o servidor de teste.", "Percorra a jornada em celular e teclado."], "expected": "Status, persistência e interface concordam com os cenários.", "bug": "Uma resposta 200 sozinha não prova que o corpo nem a gravação estão corretos.", "challenge": "Crie um teste que recarrega a página e verifica a recuperação do carrinho.", "question": "Por que separar dados de teste e produção?", "choices": ["Para testar sem alterar registros reais", "Para evitar escrever testes", "Para esconder erros", "Para dispensar banco"], "title": "Testes de integração e jornada", "minutes": 180, "quiz": [{"question": "Por que separar dados de teste e produção?", "options": ["Para dispensar banco", "Para testar sem alterar registros reais", "Para evitar escrever testes", "Para esconder erros"], "answer": 1, "explanation": "Conceito: Automatize chamadas HTTP com fetch e assert no ambiente de teste. Para navegador, use ferramenta de teste instalada no projeto, mantendo seletores por rótulo ou função acessível em vez de posições frágeis."}, {"question": "Qual resultado você deve verificar nesta prática?", "options": ["Status, persistência e interface concordam com os cenários.", "Apenas que o arquivo foi salvo, sem executar o cenário.", "Somente que a página tem aparência parecida, sem conferir comportamento.", "Nenhum resultado: uma execução sem mensagem basta."], "answer": 0, "explanation": "Conferir o resultado esperado demonstra comportamento, não só edição. Status, persistência e interface concordam com os cenários."}, {"question": "Qual cuidado evita uma conclusão incorreta nesta aula?", "options": ["Se o primeiro exemplo funcionou, não é necessário investigar outros casos.", "Alterar vários arquivos sem testar entre as alterações.", "Ignorar os erros e marcar a prática como concluída.", "Uma resposta 200 sozinha não prova que o corpo nem a gravação estão corretos."], "answer": 3, "explanation": "Este diagnóstico ajuda a localizar a causa. Uma resposta 200 sozinha não prova que o corpo nem a gravação estão corretos."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Marcar todas as tarefas antes de testar.", "Trocar apenas o título da página e encerrar o módulo.", "Crie um teste que recarrega a página e verifica a recuperação do carrinho.", "Copiar o exemplo sem executar nem explicar."], "answer": 2, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Crie um teste que recarrega a página e verifica a recuperação do carrinho."}]}, {"id": 68, "theory": "Publicação de aplicação completa envolve interface, servidor e banco. Ambientes de desenvolvimento, teste e produção devem ter configurações próprias. HTTPS protege o transporte; backups e rollback reduzem impacto de falhas. Nunca declare publicado apenas porque a compilação terminou.", "code": "Checklist de entrega:\n[ ] build e testes aprovados\n[ ] variáveis no servidor\n[ ] banco migrado e backup conferido\n[ ] HTTPS e rotas verificadas\n[ ] procedimento de rollback\n[ ] dados demonstrativos identificados", "explain": "No React, execute npm run build e confira o resultado com npm run preview. O servidor Node requer hospedagem que o execute ou adaptação explícita; GitHub Pages atende só a parte estática. Use o runbook dos materiais para conferir cada etapa.", "tasks": ["Gere uma versão de entrega com commit identificado.", "Configure um ambiente de teste completo.", "Execute testes pela UR ica automaticamente banco e servidor."}, {"question": "Qual exercício demonstra que você consegue aplicar o conteúdo?", "options": ["Trocar apenas o título da página e encerrar o módulo.", "Peça a outra pessoa para seguir seu runbook sem instruções verbais.", "Copiar o exemplo sem executar nem explicar.", "Marcar todas as tarefas antes de testar."], "answer": 1, "explanation": "Autonomia exige executar uma variação e explicar o raciocínio. Peça a outra pessoa para seguir seu runbook sem instruções verbais."}]}, {"id": 69, "theory": "Auditoria fecha lacunas que um tutorial pode não revelar. Verifique acessibilidade, desempenho, segurança e manutenção com cenários concretos. Meça antes e depois das otimizações. Uma imagem menor pode melhorar carregamento; reduzir legibilidade para ganhar pontos não é melhoria.", "code": "Relatório de auditoria:\nCenário → evidência → impacto → correção → reteste\nTeclado → foco e ordem\nCelular → leitura e controles\nRede lenta → estados e recuperação\nAPI → permissão e validação\nBackup → restauração em teste", "explain": "Guarde evidências e versões sem incluir dados privados. Priorize defeitos que impedem concluir tarefas, expõem dados ou corrompem estado.", "tasks": ["Execute a auditoria em duas larguras e com teclado.", "Corrija três problemas de maior impacto.", "Repita os mesmos cenários e registre a diferença."], "expected": "Cada problema encerrado tem evidência de reteste.", "bug": "Uma pontuação automática não cobre todas as necessidades de acessibilidade ou segurança.", "challenge": "Introduza um erro controlado no ambiente de teste e mostre como o identifica pelos logs.", "question": "O que torna uma auditoria verificável?", "choices": ["Cenários e evidências reproduzíveis", "Somente opinião visual", "Só uma nota automática", "O tamanho do README"], "title": "Auditoria e manutenção", "minutes": 180, "quiz": [{"question": "O que torna uma auditoria verificável?", "options": ["Somente opinião visual", "Só uma nota automátic
