</script><script>(function(){
'use strict';
const D=window.EVO_COURSE_DATA, esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let adapter=null;
const record=id=>(adapter.state().prog||{})[id]||{};
function home(){const done=D.lessons.filter(x=>record(x.id).done).length;return `<div class="ec"><section class="ec-hero"><span class="ec-label">EVOLUTION LAB / PROGRAMAÇÃO</span><h1>Da primeira linha<br>ao seu site completo.</h1><p>Aprenda construindo a <b>BLESSAINT</b>. Entenda, pratique com pistas e resolva sozinho.</p><div class="ec-tags"><span>71 aulas escritas</span><span>10 módulos</span><span>${done}/71 registradas</span></div><a class="ec-btn" href="#prog-${(D.lessons.find(x=>!record(x.id).done)||D.lessons[0]).id}">Continuar aprendendo →</a></section><section class="ec-panel"><h2>Seu caminho</h2><div class="ec-path"><div><b>01 / Construir comigo</b><p>Explicação e exemplo comentado.</p></div><div><b>02 / Fazer com pistas</b><p>Tarefas e diagnóstico de erros.</p></div><div><b>03 / Resolver sozinho</b><p>Desafio, testes e explicação sua.</p></div></div></section><details class="ec-panel"><summary>Seu histórico preservado</summary><p>${esc(D.history)}</p><p>Registros anteriores continuam identificados como históricos. A nova prática fica separada da nota antiga até sua conclusão.</p></details><section class="ec-panel"><h2>Trilha completa</h2><p>Marco 1: site vitrine publicado na aula 50. Marco 2: aplicação com servidor, dados, segurança e testes na aula 70. A numeração começa em zero para preservar os dados existentes.</p>${D.phases.map((p,i)=>`<details ${i===0?'open':''}><summary><b>${String(i+1).padStart(2,'0')} · ${esc(p.name)}</b><small>Aulas ${p.start}–${p.end}</small></summary>${D.lessons.filter(x=>x.id>=p.start&&x.id<=p.end).map(x=>`<a class="ec-row" href="#prog-${x.id}"><span>${record(x.id).done?'✓':String(x.id).padStart(2,'0')}</span><div>${esc(x.title)}<small>${x.minutes} min de referência · teoria + prática</small></div><span>→</span></a>`).join('')}</details>`).join('')}</section><section class="ec-panel"><h2>Concluir com autonomia</h2><p>A marcação de tarefas é uma autoavaliação. A entrega final exige projeto funcionando, testes, documentação e revisão do código por outra pessoa. XP e conclusão de leitura não certificam profissão.</p><h3>Documentação de apoio</h3>${D.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.name)} ↗</a><br>`).join('')}</section></div>`;}
function lesson(id){const x=D.lessons.find(x=>x.id===+id);if(!x)return home();const r=record(id),c=r.courseV1||{},tasks=c.tasks||[];return `<article class="ec"><a class="ec-back" href="#prog">← Voltar à trilha</a><header class="ec-panel"><span class="ec-label">AULA ${x.id} / PROJETO BLESSAINT</span><h1>${esc(x.title)}</h1><p>${x.minutes} min de referência · avance no seu ritmo</p>${r.done?'<span class="ec-tag">Registro de conclusão existente</span>':''}</header><nav class="ec-jump"><a href="#ec-theory">Entender</a><a href="#ec-code">Construir</a><a href="#ec-practice">Praticar</a><a href="#ec-quiz">Conferir</a></nav><section id="ec-theory" class="ec-panel"><span class="ec-label">01 / ENTENDER</span><h2>O conceito na prática</h2><p>${esc(x.theory)}</p><div class="ec-note"><b>Seu objetivo observável</b><p>${esc(x.expected)}</p></div></section><section id="ec-code" class="ec-panel"><span class="ec-label">02 / CONSTRUIR COMIGO</span><h2>Exemplo comentado</h2><p>Leia as indicações de arquivo antes de digitar. Os trechos marcados como HTML, CSS e JavaScript pertencem a arquivos diferentes.</p><pre tabindex="0"><code>${esc(x.code)}</code></pre><button class="ec-btn secondary" data-ec-copy="${id}">Copiar exemplo</button><p>${esc(x.explain)}</p><h3>Faça com pistas</h3>${x.tasks.map((t,k)=>`<label class="ec-check"><input type="checkbox" data-ec-task="${id}:${k}" ${tasks[k]?'checked':''}><span>${k+1}. ${esc(t)}</span></label>`).join('')}<aside class="ec-note"><b>Se algo der errado</b><p>${esc(x.bug)}</p></aside></section><section id="ec-practice" class="ec-panel"><span class="ec-label">03 / RESOLVER SOZINHO</span><h2>Desafio de autonomia</h2><p>${esc(x.challenge)}</p><form data-ec-form="${id}"><label>Arquivo ou link da sua entrega<input name="artifact" required value="${esc(c.artifact||'')}" placeholder="Ex.: index.html / link do repositório"></label><label>Explique o que fez e como testou<textarea name="explanation" minlength="40" required rows="4" placeholder="Descreva a mudança, o resultado e um caso de erro.">${esc(c.explanation||'')}</textarea></label><button class="ec-btn">Salvar minha prática</button></form><p class="ec-status" role="status">${c.artifact?'Prática registrada como autoavaliação.':''}</p></section><section id="ec-quiz" class="ec-panel"><span class="ec-label">04 / CONFERIR</span><h2>Exercícios · marque uma opção</h2><p>Quatro verificações: conceito, resultado, diagnóstico e aplicação. Aprovação a partir de três acertos, com prática preenchida e tarefas conferidas. A correção aparece depois da tentativa.</p><form data-ec-quiz="${id}">${x.quiz.map((q,k)=>`<fieldset><legend>${k+1}. ${esc(q.question)}</legend>${q.options.map((o,j)=>`<label class="ec-check"><input required type="radio" name="q${k}" value="${j}"><span>${esc(o)}</span></label>`).join('')}</fieldset>`).join('')}<button class="ec-btn">Corrigir e registrar tentativa</button></form><div class="ec-results" role="status">${c.best!==undefined?`Melhor tentativa desta versão: ${c.best}/4. ${c.completed?'Prática e quiz concluídos.':''}`:''}</div></section><nav class="ec-footer">${+id>0?`<a class="ec-btn secondary" href="#prog-${+id-1}">← Anterior</a>`:'<span></span>'}${+id<70?`<a class="ec-btn" href="#prog-${+id+1}">Próxima →</a>`:'<a class="ec-btn" href="#prog">Ver trilha</a>'}</nav></article>`;}
function getCourse(id){return record(id).courseV1||{};}
function complete(id,c){const x=D.lessons[id];return c.best>=3&&c.artifact&&c.explanation?.length>=40&&x.tasks.every((_,k)=>c.tasks?.[k]);}
function update(id,fn){adapter.change(()=>{const old=record(id),c={...getCourse(id),tasks:[...(getCourse(id).tasks||[])]};fn(c);const next={...old,courseV1:c};if(complete(id,c)){if(!old.courseV1?.completed)c.completedAt=Date.now();c.completed=true;if(!old.courseV1&&old.done)next.legacyRecord={...old};next.done=true;next.ok=c.best;next.tot=4;}adapter.state().prog[id]=next;},'Programação · Aula '+id);}
document.addEventListener('change',e=>{if(!adapter||!e.target.matches('[data-ec-task]'))return;const [id,k]=e.target.dataset.ecTask.split(':');update(id,c=>c.tasks[k]=e.target.checked);});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-ec-copy]');if(!b)return;try{await navigator.clipboard.writeText(D.lessons[+b.dataset.ecCopy].code);b.textContent='Copiado';}catch{b.textContent='Selecione o código acima para copiar';}});
document.addEventListener('submit',e=>{if(!adapter)return;const f=e.target;if(f.dataset.ecForm!==undefined){e.preventDefault();const id=f.dataset.ecForm,fd=new FormData(f);update(id,c=>{c.artifact=String(fd.get('artifact')).trim();c.explanation=String(fd.get('explanation')).trim();});f.parentElement.querySelector('[role=status]').textContent='Prática salva como autoavaliação. '+(getCourse(id).completed?'Aula concluída.':'Confira as tarefas e o quiz.');}
if(f.dataset.ecQuiz!==undefined){e.preventDefault();const id=+f.dataset.ecQuiz,x=D.lessons[id],fd=new FormData(f),answers=x.quiz.map((_,k)=>Number(fd.get('q'+k))),score=x.quiz.filter((q,k)=>answers[k]===q.answer).length;update(id,c=>{c.best=Math.max(c.best||0,score);c.attempts=[...(c.attempts||[]),{at:Date.now(),answers,score}].slice(-20);});const c=getCourse(id);f.nextElementSibling.innerHTML=`<h3>${score}/4 · ${score>=3?'Quiz aprovado':'Revise e tente novamente'}</h3>${x.quiz.map((q,k)=>`<p><b>${answers[k]===q.answer?'✓':'✕'} Questão ${k+1}</b> · ${esc(q.options[q.answer])}<br>${esc(q.explanation)}</p>`).join('')}<p>${c.completed?'Aula concluída com prática e quiz.':'Para concluir, registre sua prática e confira todas as tarefas; o quiz exige pelo menos 3/4.'}</p>`;adapter.feedback?.(score>=3);}});
window.EvoCourse={mount(a){adapter=a;},home,lesson,complete};
})();
</script><script>const key="evo-course-preview-v1";let state={prog:{}};try{state=JSON.parse(localStorage.getItem(key))||state;}catch{};state.prog=state.prog||{};EvoCourse.mount({state:()=>state,change:fn=>{fn();try{localStorage.setItem(key,JSON.stringify(state));}catch{document.getElementById('save-note').textContent='Armazenamento indisponível; esta prévia mantém dados apenas durante a sessão.';}}});function paint(){const match=location.hash.match(/^#prog-(\d+)$/);document.getElementById('preview').innerHTML=match?EvoCourse.lesson(match[1]):EvoCourse.home();window.scrollTo(0,0);}addEventListener('hashchange',()=>{if(!location.hash.startsWith('#ec-'))paint();});paint();</script></html>
