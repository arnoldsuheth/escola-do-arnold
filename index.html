<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolution Lab</title>
<meta name="description" content="A escola particular do Arnold: Curso de Claude, Programação com a BLESSAINT e Faculdade Estácio.">
<meta name="theme-color" content="#0B0E1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evo Lab">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Direção: "árvore de habilidades" — RPG da carreira dev. Painel escuro de ferramenta, violeta e ciano como energia, âmbar para constância, tipografia Inter + JetBrains Mono. */
:root{
  --bg:#0B0E14; --bg2:#0E131C; --card:#121722; --card2:#171D2B; --card3:#1E2533;
  --line:#1E2533; --line2:#2A3245;
  --text:#E6E8EE; --muted:#A3ABBD; --dim:#929DB3;
  --violet:#A78BFA; --violet2:#7C5CFF; --cyan:#22D3EE; --amber:#F59E0B; --pink:#F472B6; --green:#34D399; --red:#F87171;
  --gold:#22D3EE; --fire:#F59E0B; --sky:#22D3EE;
  --claude:#F59E0B; --prog:#A78BFA; --fac:#F472B6;
  --ok:#34D399; --bad:#F87171;
  --grad:linear-gradient(90deg,#7C5CFF,#22D3EE);
  --r:16px;
  --f-d:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-b:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-m:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --ink:#E6E8EE; --ink2:#A3ABBD; --paper:#0E131C; --pen:#A78BFA; --pen-soft:#1D1A33;
  --hl:#22D3EE; --hl-ink:#04161A; --red2:#F87171; --ok-soft:#0F2A22; --c-claude:#F59E0B; --c-claude-soft:#2A2010;
  --f-body:var(--f-b); --f-hand:var(--f-m); --f-mono:var(--f-m);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-b);font-size:15.5px;line-height:1.6;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 480px at 100% -10%,rgba(124,92,255,.12),transparent 60%),radial-gradient(700px 420px at 0% 110%,rgba(34,211,238,.07),transparent 60%)}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;line-height:1.12;text-wrap:balance;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(1.9rem,5.2vw,2.7rem)}
h2{font-size:clamp(1.3rem,3.4vw,1.75rem)}
h3{font-size:1.05rem;letter-spacing:-.01em}
p{margin:0 0 .8em}
code{font-family:var(--f-m);font-size:.85em;background:#1A2030;color:#C9D4FF;padding:.12em .4em;border-radius:6px}
pre{background:#080B11;border:1px solid var(--line);color:#D6DEFF;padding:14px 16px;border-radius:12px;overflow-x:auto;font-size:.82rem;line-height:1.6;margin:.6em 0 1em;font-family:var(--f-m)}
pre code{background:none;padding:0;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.mono{font-family:var(--f-m)}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.eyebrow{font-family:var(--f-m);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--dim)}
.gtext{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* app shell */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:rgba(11,14,20,.85)}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 22px;text-decoration:none;color:var(--text)}
.brand b{font-weight:700;font-size:.98rem;line-height:1.2;display:block}
.brand small{display:block;font-family:var(--f-m);font-size:.72rem;color:var(--cyan)}
.crest{width:42px;height:42px;flex:none}
.navi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--dim);font-weight:600;font-size:.93rem}
.navi svg{width:20px;height:20px;flex:none}
.navi:hover{background:var(--card);color:var(--text)}
.navi[aria-current="page"]{background:var(--card2);color:var(--text)}
.navi[aria-current="page"] svg{color:var(--cyan)}
.rail .spacer{flex:1}
.rail .sync{font-family:var(--f-m);font-size:.72rem;color:var(--dim);padding:8px 12px;display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--amber)} .dot.busy{background:var(--cyan);animation:pulse 1s infinite}
.main{min-width:0}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px max(18px,env(safe-area-inset-right,0px)) 12px max(18px,env(safe-area-inset-left,0px));background:rgba(11,14,20,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar .brand{display:none;padding:0;margin-right:auto}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;background:var(--card);border:1px solid var(--line);font-family:var(--f-m);font-size:.8rem;white-space:nowrap;text-decoration:none;color:var(--text)}
.pill svg{width:15px;height:15px}
.pill.fire{color:var(--amber)} .pill.xp{color:var(--cyan)} .pill.lvl{color:var(--violet)}
.pill.fire.cold{color:var(--dim)}
.wrap{max-width:1180px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-right,0px)) 80px max(18px,env(safe-area-inset-left,0px))}
.tabbar{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .topbar .brand{display:flex}
  .topbar .brand small{display:none}
  .topbar .pill.lvl{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,19,28,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;text-decoration:none;color:var(--dim);font-size:.66rem;font-weight:600}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--cyan)}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}

/* cartões e botões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.glow{border-color:var(--line2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;min-height:46px;border-radius:11px;font-weight:700;font-size:.92rem;text-decoration:none;background:var(--card2);color:var(--text);border:1px solid var(--line2);transition:filter .12s, transform .12s}
.btn:hover{filter:brightness(1.18)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:var(--grad);color:#0B0E14;border:0}
.btn.ok{background:linear-gradient(90deg,#10B981,#34D399);color:#04140E;border:0}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:7px 13px;font-size:.84rem;border-radius:9px}
.btn svg{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-family:var(--f-m);font-size:.72rem;background:var(--card3);color:var(--muted)}
.tag.cl{background:rgba(245,158,11,.12);color:var(--amber)} .tag.pg{background:rgba(167,139,250,.14);color:var(--violet)} .tag.fc{background:rgba(244,114,182,.13);color:var(--pink)}
.tag.ok{background:rgba(52,211,153,.13);color:var(--green)} .tag.bad{background:rgba(248,113,113,.13);color:var(--red)} .tag.gold{background:rgba(34,211,238,.12);color:var(--cyan)}
.bar{height:8px;border-radius:99px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.field{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted)}
.input,.field input,.field select,.field textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;min-height:44px;font-weight:500;width:100%}
.input:focus,.field input:focus,.field textarea:focus{outline:none;border-color:var(--cyan)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:9px;background:var(--card2);border:1px solid var(--line2);font-family:var(--f-m);font-size:.8rem;min-height:36px}
.chip[aria-pressed="true"]{background:var(--cyan);color:#04161A;border-color:var(--cyan)}
.err{color:var(--red);font-weight:600;font-size:.85rem;min-height:1.2em}

/* PAINEL */
.dash > *,.stack > *,.hero-grid > *{min-width:0}
.dash{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.dash{grid-template-columns:1fr}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.head h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.k{font-family:var(--f-m);font-size:.7rem;color:var(--dim);text-transform:uppercase;letter-spacing:.14em}
.career{display:flex;align-items:center;gap:8px;margin-top:14px;overflow-x:auto;padding-bottom:2px}
.career span{font-family:var(--f-m);font-size:.78rem;color:#4F586D;white-space:nowrap}
.career span.on{color:var(--text)} .career span.cur{color:var(--cyan);font-weight:600}
.career i{flex:1;min-width:16px;height:2px;background:#232B3B;border-radius:2px}
.career i.on{background:var(--cyan)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-weight:800;font-size:1.55rem;letter-spacing:-.03em;margin-top:4px;line-height:1.1}
.stat .v small{font-family:var(--f-m);font-weight:400;font-size:.74rem;color:var(--dim);letter-spacing:0}
.attr{display:grid;grid-template-columns:104px minmax(0,1fr) 32px;gap:10px;align-items:center;font-size:.92rem;margin-top:11px}
.attr .bar{height:7px}
.attr b{font-family:var(--f-m);font-weight:400;font-size:.8rem;color:var(--dim);text-align:right}
.tree{width:100%;height:auto;display:block}
.tree text{font-family:var(--f-m);font-size:11px}
.weekt{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:14px}
.weekt div{text-align:center}
.weekt i{display:block;height:48px;border-radius:9px;background:var(--card3)}
.weekt i.on{background:var(--cyan)}
.weekt i.rest{background:transparent;border:1.5px dashed var(--line2)}
.weekt i.today{box-shadow:0 0 0 2px var(--text)}
.weekt i.on.today{background:var(--grad)}
.weekt small{font-family:var(--f-m);font-size:.7rem;color:var(--dim)}
.quest{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--text)}
.quest:first-of-type{border-top:0}
.quest .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line2)}
.quest .ic svg{width:15px;height:15px}
.quest.done .ic{background:var(--cyan);border-color:var(--cyan);color:#04161A}
.quest.done b{color:var(--dim);text-decoration:line-through;font-weight:500}
.quest .rw{font-family:var(--f-m);color:var(--violet);font-size:.78rem;white-space:nowrap}
.quest:hover b{color:#fff}
.goal{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.ring text{font-family:var(--f-m);font-weight:600;fill:var(--text)}
.badge-mini{display:flex;gap:10px;align-items:center;padding:10px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:.86rem}
.badge-mini i{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 .62rem var(--f-m);font-style:normal;flex:none;color:#0B0E14}
.badge-mini.off i{background:var(--card3)!important;color:var(--dim)}
.badge-mini.off{color:var(--dim)}
.course{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--text);border-radius:var(--r);padding:16px;background:var(--card);border:1px solid var(--line);transition:border-color .15s}
.course:hover{border-color:var(--line2)}
.course .ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card3)}
.course .ico svg{width:20px;height:20px}
.c-cl .ico{color:var(--amber)} .c-pg .ico{color:var(--violet)} .c-fc .ico{color:var(--pink)}
.course h3{font-size:1rem}
.course .grow{flex:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--card3)}
.heat i.l1{background:#173B47} .heat i.l2{background:#156075} .heat i.l3{background:#1597B0} .heat i.l4{background:#22D3EE}
.quote{font-weight:600;font-size:1rem;line-height:1.45}

/* hero de curso */
.course-hero{border-radius:20px;padding:clamp(20px,3.5vw,30px);border:1px solid var(--line);background:var(--card);position:relative;overflow:hidden}
.course-hero::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--acc,var(--grad))}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:760px){.hero-grid{grid-template-columns:1fr}}

/* TRILHA (curso de Claude) */
.trail{position:relative;display:flex;flex-direction:column;align-items:center;padding:6px 0 30px}
.unit{width:100%;max-width:680px;border-radius:14px;padding:14px 16px;margin:24px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card)}
.unit h3{font-size:1rem}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:8px 0}
.node{position:relative;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--muted);background:var(--bg2);border:2px solid var(--line2);font-family:var(--f-m);font-weight:600;font-size:1.05rem;transition:transform .12s,border-color .12s}
.node:hover{border-color:var(--violet);color:var(--text)}
.node.done{background:var(--cyan);border-color:var(--cyan);color:#04161A}
.node.cur{border-color:var(--violet);color:var(--text);box-shadow:0 0 0 6px rgba(124,92,255,.18),0 0 28px rgba(124,92,255,.35)}
.node.rev{border-radius:16px}
.node svg{width:26px;height:26px}
.node-lbl{margin-top:10px;text-align:center;font-weight:600;font-size:.86rem;max-width:min(220px,44vw);line-height:1.3}
.node-lbl small{display:block;color:var(--dim);font-family:var(--f-m);font-weight:400;font-size:.7rem;margin-top:2px}
.stars{display:flex;gap:2px;justify-content:center;margin-top:5px}
.stars svg{width:13px;height:13px}
.bubble{position:absolute;top:-30px;white-space:nowrap;background:var(--violet2);color:#fff;font-family:var(--f-m);font-size:.66rem;padding:4px 8px;border-radius:6px;letter-spacing:.08em}

/* AULA */
.read-bar{position:fixed;left:0;top:0;height:3px;z-index:50;background:var(--grad);width:0}
.lesson{max-width:780px;margin:0 auto}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.84rem;font-family:var(--f-m)}
.crumbs a{text-decoration:none;color:var(--muted)}
.fig{margin:0;border-radius:16px;padding:14px;background:var(--bg2);border:1px solid var(--line)}
.fig svg{display:block;width:100%;height:auto}
.content{font-size:1.02rem}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-top:12px}
.sec h3{display:flex;gap:12px;align-items:center;font-size:1.08rem;margin-bottom:10px}
.sec h3 .k{width:30px;height:30px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;background:rgba(124,92,255,.16);color:var(--violet);font-family:var(--f-m);font-size:.82rem;letter-spacing:0}
.sec ul,.sec ol{padding-left:1.25em;margin:.3em 0 .6em} .sec li{margin:.3em 0}
.sec b{color:#fff}
.tip{display:flex;gap:14px;padding:16px 18px;border-radius:16px;background:rgba(34,211,238,.06);border:1px solid rgba(34,211,238,.28)}
.tip svg{width:24px;height:24px;color:var(--cyan);flex:none}
.divider{display:flex;align-items:center;gap:14px;margin:26px 0 6px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line2)}
.divider h2{font-family:var(--f-m);font-weight:500;font-size:.85rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.mind{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.mind .center{grid-column:1/-1;text-align:center;padding:12px;border-radius:12px;background:var(--grad);color:#0B0E14;font-weight:800}
.mind .n{padding:11px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--violet);font-weight:500;font-size:.9rem;line-height:1.35}

/* QUIZ */
.quiz{background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:clamp(16px,3vw,24px)}
.qprog{display:flex;gap:5px}
.qprog i{flex:1;height:5px;border-radius:99px;background:var(--card3)}
.qprog i.ok{background:var(--green)} .qprog i.bad{background:var(--red)} .qprog i.cur{background:var(--violet)}
.qtext{font-weight:700;font-size:clamp(1.05rem,3vw,1.25rem);line-height:1.35;margin:16px 0 12px;letter-spacing:-.01em}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:12px;background:var(--bg2);border:1.5px solid var(--line2);margin-top:9px;font-weight:500;line-height:1.4;transition:border-color .1s}
.opt:hover{border-color:#3B4560}
.box{flex:none;width:22px;height:22px;border:2px solid #4B556D;border-radius:6px;position:relative;margin-top:-1px}
.opt[aria-checked="true"]{border-color:var(--violet);background:rgba(124,92,255,.08)}
.opt[aria-checked="true"] .box{border-color:var(--violet)}
.opt[aria-checked="true"] .box::before,.opt[aria-checked="true"] .box::after{content:"";position:absolute;left:50%;top:50%;width:18px;height:3px;background:var(--violet);border-radius:2px}
.opt[aria-checked="true"] .box::before{transform:translate(-50%,-50%) rotate(45deg)}
.opt[aria-checked="true"] .box::after{transform:translate(-50%,-50%) rotate(-45deg)}
.opt.right{border-color:var(--green);background:rgba(52,211,153,.08)} .opt.right .box{border-color:var(--green)} .opt.right .box::before,.opt.right .box::after{background:var(--green)}
